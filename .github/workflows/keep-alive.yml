name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *' # Every 3 days at 8:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Response code: $response"
          if [ "$response" -ne 200 ]; then
            echo "::warning::Supabase ping returned $response"
            exit 1
          fi
          echo "Supabase project is alive"
