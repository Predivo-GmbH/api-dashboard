name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs
        continue-on-error: true

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy via FTP (zero-downtime)
        run: |
          sudo apt-get install -y lftp
          FTP_CONN="set ftp:ssl-allow no; set ftp:passive-mode yes; set net:max-retries 3; set net:reconnect-interval-base 5; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }};"

          echo "apis" > ./dist/.site-id

          REMOTE_ID=$(lftp -e "${FTP_CONN} cat /apis.predivo.ch/.site-id; quit" 2>/dev/null || echo "")
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "apis" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'apis'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"

          # Step 1: Upload new hashed assets alongside old ones (no deletion yet)
          lftp -e "
            $FTP_CONN
            mirror --reverse --no-perms --verbose ./dist/assets/ /apis.predivo.ch/assets/;
            quit;
          "

          # Step 2: Upload index.html + root files (switches to new asset references)
          lftp -e "
            $FTP_CONN
            put ./dist/.site-id -o /apis.predivo.ch/.site-id;
            put ./dist/index.html -o /apis.predivo.ch/index.html;
            put ./dist/.htaccess -o /apis.predivo.ch/.htaccess;
            put ./dist/favicon.svg -o /apis.predivo.ch/favicon.svg;
            quit;
          "

          # Step 3: Clean up stale assets no longer in the new build
          lftp -e "
            $FTP_CONN
            mirror --reverse --delete --no-perms --verbose ./dist/assets/ /apis.predivo.ch/assets/;
            quit;
          "
